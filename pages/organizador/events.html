<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis eventos | UPC</title>
    <link rel="icon" type="image/png" href="../../img/favicon-upc.png">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <a href="../../index.html" class="logo"><img src="../../img/favicon-upc.png" alt="UPC - Ir al inicio"></a>
            <input type="checkbox" id="menu-abierto" class="menu-toggle" aria-hidden="true">
            <label for="menu-abierto" class="menu-btn" aria-label="Abrir menú"><span></span><span></span><span></span></label>
            <nav class="nav-links">
                <a href="events.html">Mis eventos</a>
                <a href="new-event.html">Nuevo evento</a>
                <span class="usuario" id="nombre-usuario"></span>
                <button type="button" class="btn btn-primary" id="boton-salir">Salir</button>
            </nav>
        </div>
    </header>

    <main class="container page">
        <div class="page-head">
            <div>
                <h1>Mis eventos</h1>
                <p>Administra los eventos que has creado.</p>
            </div>
            <a href="new-event.html" class="btn btn-primary">+ Nuevo evento</a>
        </div>

        <div class="toolbar">
            <div class="search">
                <input type="search" id="buscador" placeholder="Buscar por nombre…" aria-label="Buscar eventos">
            </div>
        </div>

        <div class="event-list" id="lista-eventos"></div>
    </main>

    <button type="button" class="asistente-boton" id="boton-chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></svg>
        Asistente
    </button>

    <section class="asistente-ventana" id="ventana-chat" hidden>
        <div class="chat-head">
            <div><strong>Asistente</strong><span>Te ayuda a gestionar eventos</span></div>
            <button type="button" id="boton-cerrar-chat">Cerrar</button>
        </div>
        <div class="chat-msgs" id="mensajes">
            <div class="msg msg-bot">¡Hola! Puedo ayudarte a crear un evento o revisar tus eventos.</div>
        </div>
        <form class="chat-form" id="formulario-chat">
            <input type="text" id="texto-chat" placeholder="Escribe tu pregunta…" autocomplete="off" required>
            <button type="button" class="btn" id="boton-microfono" title="Mantén pulsado para hablar">🎤</button>
            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
    </section>

    <script src="../../js/localstorage.js"></script>
    <script src="../../js/events.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/agent.js"></script>
</body>
</html>
