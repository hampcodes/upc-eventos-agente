<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | UPC</title>
    <link rel="icon" type="image/png" href="../../img/favicon-upc.png">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="auth-page">
        <header class="navbar">
        <div class="container">
            <a href="../../index.html" class="logo"><img src="../../img/favicon-upc.png" alt="UPC - Ir al inicio"></a>
            <input type="checkbox" id="menu-abierto" class="menu-toggle" aria-hidden="true">
            <label for="menu-abierto" class="menu-btn" aria-label="Abrir menú"><span></span><span></span><span></span></label>
            <nav class="nav-links">
                <a href="../../index.html">Inicio</a>
                <a href="sigin.html" class="btn btn-primary">Registrarse</a>
            </nav>
        </div>
    </header>

    <main class="auth-box">
        <h1>Bienvenido de nuevo</h1>
        <p>Ingresa a tu cuenta para continuar.</p>

        <form id="formulario-login">
            <div class="field">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="tu@correo.com" required>
            </div>
            <div class="field">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required>
            </div>
            <p class="form-error" id="mensaje-error"></p>
            <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
        </form>

        <p class="auth-foot">¿No tienes cuenta? <a href="sigin.html">Regístrate</a></p>
    </main>
    <script src="../../js/localstorage.js"></script>
    <script src="../../js/auth.js"></script>
</body>
</html>
